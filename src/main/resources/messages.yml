# ULTRAS_Discord_logs_v1 - Discord embed templates.
# Placeholders: %player% %uuid% %ip% %rank% %world% %x% %y% %z% %gamemode% %executor% %target% %command% %reason% %duration%
#   %time% %date% %server% %version% %is_op% %is_vanish% %log_id% (+ log specific ones, see README).
# A field whose placeholders are all unavailable is skipped automatically; partially unavailable values show "Unknown".
# 'fields' accepts normal fields {name, value, inline, enabled} or {bundle: <name>} to insert a shared group.
# Language files (messages_en.yml / messages_ar.yml) can override titles (discord.<log>.title) and field names (discord-field-names.<key>).
discord-messages:
  _defaults:
    footer: "ULTRAS | Minecraft Logs"
    footer-icon: ""
    timestamp: true
    thumbnail: "%avatar%"
    image: ""
    author-name: ""
    author-icon: ""
  _bundles:
    player:
      player: {name: "Player", value: "%player%", inline: true}
      uuid: {name: "UUID", value: "%uuid%", inline: true}
    state:
      rank: {name: "Rank", value: "%rank%", inline: true}
      op: {name: "OP", value: "%is_op%", inline: true}
      vanish: {name: "Vanish", value: "%is_vanish%", inline: true}
    where:
      world: {name: "World", value: "%world%", inline: true}
      location: {name: "Location", value: "%location%", inline: true}
    when:
      date: {name: "Date", value: "%date%", inline: true}
      time: {name: "Time", value: "%time%", inline: true}
  join:
    enabled: true
    title: "🟢 Player Joined"
    color: "#57F287"
    description: ""
    content: ""
    fields:
      player: {bundle: player}
      state: {bundle: state}
      where: {bundle: where}
      platform: {name: "Platform", value: "%platform%", inline: true}
      session: {name: "Session", value: "%session_type%", inline: true}
      ip: {name: "IP", value: "%ip%", inline: true}
      ping: {name: "Ping", value: "%ping% ms", inline: true}
      when: {bundle: when}
  quit:
    enabled: true
    title: "⚪ Player Left"
    color: "#99AAB5"
    description: ""
    content: ""
    fields:
      player: {bundle: player}
      state: {bundle: state}
      where: {bundle: where}
      session_duration: {name: "Session Duration", value: "%session_duration%", inline: true}
      reason: {name: "Reason", value: "%reason%", inline: true}
      when: {bundle: when}
  first-join:
